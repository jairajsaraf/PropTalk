# PropTalk theme: warm paper, ink text, one deep-green accent that also means "verified".
# Serif headings, sans body. The two web fonts load from Google Fonts; if they are
# blocked the browser falls back to the system serif / sans-serif.

[theme]
base = "light"
primaryColor = "#1E6B52"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EEE7"
textColor = "#1D2125"
greenColor = "#2F7D5B"
blueColor = "#2D5F8B"
redColor = "#B5483A"
linkColor = "#1E6B52"
borderColor = "#DDD8CC"
dataframeBorderColor = "#DDD8CC"
dataframeHeaderBackgroundColor = "#F1EEE7"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
# headingFont registers the serif face; ui_style.py applies it to headings.
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&display=swap"
headingFontSizes = ["2.6rem", "1.8rem", "1.4rem", "1.1rem"]
headingFontWeights = [600, 600, 600, 500]
baseRadius = "0.5rem"
buttonRadius = "full"
showWidgetBorder = true
chartCategoricalColors = ["#1E6B52", "#C27C2C", "#2D5F8B", "#8C5A7A", "#6B7A3A", "#B5483A", "#5B6770", "#A08C5B"]
chartSequentialColors = ["#EEF5F1", "#D5E7DD", "#B6D4C5", "#93BFA8", "#6FA88A", "#4E8F70", "#2F7757", "#1E6B52", "#14503D", "#0C3B2D"]

[theme.sidebar]
backgroundColor = "#F3F0E9"
